[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ActivationPrototypes-SARSeg"
version = "0.0.1"
description = "Code base for the paper 'Activation-Based Examples for Explainability in
Semantic Segmentation of SAR Imagery'"
authors = [
  { name = "Janes Luc Sanne" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10"

[tool.setuptools.packages]
find = { where = ["ActivationExamples_SARSeg"] }